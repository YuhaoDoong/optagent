[project]
name = "optagent"
version = "0.4.0-dev"
description = "US equity options research agent — long-premium-only verdicts with audit-grade reproducibility."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "yhdong" }]
dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
adapters = [
    "yfinance>=0.2,<1",
    "fredapi>=0.5,<1",
    "requests>=2.31,<3",
]
llm = [
    "anthropic>=0.40,<1",
    "tiktoken>=0.7,<1",
    "openai>=1.40",  # also used for OpenRouter (OpenAI-compatible gateway)
]
ui = [
    "streamlit>=1.30,<2",
    "plotly>=5,<7",
    "pandas>=2,<3",
]
# Moomoo/Futu OpenD option-chain source (real bid/ask + OI even after-hours).
# Requires a local OpenD gateway running on 127.0.0.1:11111.
moomoo = [
    "moomoo-api>=10,<11",
    "pandas>=2,<3",
]

[project.scripts]
optagent = "optagent.cli:main"
optagent-ui = "optagent.web.launcher:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
